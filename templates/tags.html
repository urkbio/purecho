{% extends "base.html" %}

{% block title %}标签云 - {{ config.SITE_TITLE }}{% endblock %}

{% block content %}
<div class="tags-page">
    {% if tags %}
        <div class="tags-cloud">
            {% for tag in tags %}
                <div class="tag-item">
                    <a href="{{ url_for('tag', name=tag.name) }}" class="nav-item tag-link">
                        <span class="tag-name">{{ tag.name }}</span>
                        <span class="tag-count">{{ tag.posts.count() }}</span>
                    </a>
                </div>
            {% endfor %}
        </div>
        
        <div class="tags-stats">
            <p>共 <strong>{{ tags|length }}</strong> 个标签</p>
        </div>
    {% else %}
        <div class="no-tags">
            <p>暂无标签</p>
        </div>
    {% endif %}
</div>

<style>
.tags-page {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

.tags-page h1 {
    text-align: center;
    margin-bottom: 30px;
    color: #333;
}

.tags-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    margin-bottom: 30px;
}

.tag-link {
    display: flex;
    align-items: center;
}

.tag-name {
    margin-right: 8px;
    font-weight: 500;
}

.tag-count {
    color: var(--light-text);
    font-size: 12px;
}

.tags-stats {
    text-align: center;
    color: #666;
    font-size: 14px;
}

.no-tags {
    text-align: center;
    color: #666;
    font-style: italic;
    margin-top: 50px;
}

@media (max-width: 600px) {
    .tags-cloud {
        gap: 10px;
    }
}
</style>
{% endblock %}
